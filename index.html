<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Desk Snack" />
  <title>Desk Snack — Temporizador Sit-Stand</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main id="app" class="app">
    <div class="screen-main">
      <p class="state-label" id="state-label">—</p>
      <div class="timer-ring" id="timer-ring" aria-hidden="true">
        <svg viewBox="0 0 100 100" class="timer-svg">
          <circle class="timer-bg" cx="50" cy="50" r="45" />
          <circle class="timer-progress" id="timer-progress" cx="50" cy="50" r="45" />
        </svg>
        <span class="timer-display" id="timer-display" aria-live="polite" aria-atomic="true">00:00</span>
      </div>
      <button type="button" class="btn-primary" id="btn-main" aria-label="Iniciar">Iniciar</button>
    </div>
    <div class="overlay" id="alert-overlay" role="dialog" aria-modal="true" aria-labelledby="alert-title" hidden>
      <div class="overlay-backdrop" id="alert-backdrop"></div>
      <div class="overlay-content">
        <h2 class="overlay-title" id="alert-title">¡Hora de levantarte!</h2>
        <div class="snack-card" id="snack-card" hidden>
          <p class="snack-label">Snack de ejercicio</p>
          <p class="snack-text" id="snack-text"></p>
        </div>
        <button type="button" class="btn-confirm" id="btn-confirm">Confirmar</button>
      </div>
    </div>
  </main>
  <script src="/js/app.js" defer></script>
</body>
</html>
