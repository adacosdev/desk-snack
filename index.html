<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Desk Snack" />
  <title>Desk Snack — Temporizador Sit-Stand</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main id="app" class="app" data-state="idle">
    <div class="screen-main">
      <p class="state-label" id="state-label">—</p>
      <div class="timer-ring" id="timer-ring" aria-hidden="true">
        <svg viewBox="0 0 100 100" class="timer-svg">
          <circle class="timer-bg" cx="50" cy="50" r="45" />
          <circle class="timer-progress" id="timer-progress" cx="50" cy="50" r="45" />
        </svg>
        <span class="timer-display" id="timer-display" aria-live="polite" aria-atomic="true">00:00</span>
      </div>
      <button type="button" class="btn-primary" id="btn-main" aria-label="Iniciar">Iniciar</button>
      <button type="button" class="btn-settings" id="btn-settings" aria-label="Configuración">
        <svg class="icon-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        Configuración
      </button>
    </div>
    <div class="sheet" id="settings-sheet" aria-modal="true" aria-label="Configuración" hidden>
      <div class="sheet-backdrop" id="settings-backdrop"></div>
      <div class="sheet-panel">
        <div class="sheet-handle" aria-hidden="true"></div>
        <h2 class="sheet-title">Configuración</h2>
        <div class="setting-row">
          <label for="sitting-min" class="setting-label">Minutos sentado</label>
          <div class="setting-control">
            <input type="range" id="sitting-min" min="1" max="120" value="25" />
            <span class="setting-value" id="sitting-value">25</span> min
          </div>
        </div>
        <div class="setting-row">
          <label for="standing-min" class="setting-label">Minutos de pie</label>
          <div class="setting-control">
            <input type="range" id="standing-min" min="1" max="60" value="5" />
            <span class="setting-value" id="standing-value">5</span> min
          </div>
        </div>
        <div class="setting-row setting-row-toggle">
        <span class="setting-label">Tema</span>
        <button type="button" class="toggle-theme" id="btn-theme" aria-pressed="false">Modo claro</button>
      </div>
      <button type="button" class="btn-secondary" id="btn-reset">Restablecer valores</button>
      </div>
    </div>
    <div class="overlay" id="alert-overlay" role="dialog" aria-modal="true" aria-labelledby="alert-title" hidden>
      <div class="overlay-backdrop" id="alert-backdrop"></div>
      <div class="overlay-content">
        <h2 class="overlay-title" id="alert-title">¡Hora de levantarte!</h2>
        <div class="snack-card" id="snack-card" hidden>
          <p class="snack-label">Snack de ejercicio</p>
          <p class="snack-text" id="snack-text"></p>
        </div>
        <button type="button" class="btn-confirm" id="btn-confirm">Confirmar</button>
      </div>
    </div>
  </main>
  <script src="/js/app.js" defer></script>
</body>
</html>
